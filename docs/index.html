<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather ZenithX</title>
  <style>
    :root {
      --bg-outer: #16181d;
      --card-dark: #141413;
      --text-main: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.82);
      --accent: #f49b52;
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-outer);
      color: var(--text-main);
      padding: 0.9rem 0.9rem 5.5rem 0.9rem;
      display: flex;
      justify-content: center;
      transition: background 0.5s ease;
    }

    body.theme-day {
      background: linear-gradient(180deg, #279be8 0%, #58b8f5 52%, #6f776c 100%);
    }

    body.theme-night {
      background: linear-gradient(180deg, #070b17 0%, #101933 55%, #191d26 100%);
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .hero {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      padding: 1.15rem;
      min-height: 330px;
      border: 1px solid var(--border);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
      background: linear-gradient(180deg, #1693e6 0%, #5cc0ff 72%, #8cd4ff 100%);
      transition: background 0.6s ease;
    }

    .hero.night {
      background: linear-gradient(180deg, #040711 0%, #0b152e 65%, #15223f 100%);
    }

    .sky-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity, transform;
      transition: opacity 0.5s ease;
      background-image:
        radial-gradient(1.5px 1.5px at 14% 18%, #ffffff, transparent),
        radial-gradient(1px 1px at 28% 36%, #e2e8f0, transparent),
        radial-gradient(2px 2px at 46% 14%, #ffffff, transparent),
        radial-gradient(1.2px 1.2px at 66% 24%, #cbd5e1, transparent),
        radial-gradient(1.8px 1.8px at 82% 16%, #ffffff, transparent),
        radial-gradient(1px 1px at 90% 38%, #f8fafc, transparent),
        radial-gradient(1.5px 1.5px at 36% 52%, #e2e8f0, transparent);
    }

    .hero.night .stars {
      opacity: 0.9;
      animation: starTwinkle 3.6s ease-in-out infinite;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.65; transform: translate3d(0, 0, 0); }
      50% { opacity: 1; transform: translate3d(0, -1px, 0); }
    }

    .celestial {
      position: absolute;
      top: 56px;
      right: 24px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      z-index: 1;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      transition: all 0.5s ease;
    }

    .celestial.sun {
      background: radial-gradient(circle at 35% 35%, #fff59d 0%, #ffca28 55%, #ff8f00 100%);
      box-shadow: 0 0 28px rgba(255, 202, 40, 0.88), 0 0 64px rgba(255, 143, 0, 0.48);
      animation: sunPulse 4.5s ease-in-out infinite;
    }

    .celestial.sun::after {
      content: "";
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 236, 153, 0.55);
      animation: sunOrbit 14s linear infinite;
    }

    .celestial.moon {
      background: radial-gradient(circle at 32% 30%, #ffffff 0%, #e2e8f0 68%, #94a3b8 100%);
      box-shadow: 0 0 26px rgba(226, 232, 240, 0.72), 0 0 54px rgba(148, 163, 184, 0.35);
      animation: moonFloat 5s ease-in-out infinite;
    }

    .celestial.moon::after { content: none; }

    .hero.cloudy .celestial { opacity: 0.72; filter: blur(0.5px); }
    .hero.clear .celestial { opacity: 1; filter: none; }

    @keyframes sunPulse {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(0, -3px, 0) scale(1.05); }
    }

    @keyframes sunOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes moonFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -4px, 0); }
    }

    /* 2D Shaded Clouds */
    .cloud {
      position: absolute;
      border-radius: 999px;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .cloud.front { z-index: 3; }
    .cloud.back { z-index: 0; }

    .hero:not(.night) .cloud {
      background: linear-gradient(180deg, #ffffff 0%, #e8eef7 68%, #c7d4e6 100%);
      box-shadow: 0 4px 0 rgba(148, 163, 184, 0.35);
    }
    .hero:not(.night) .cloud::before { background: #ffffff; }
    .hero:not(.night) .cloud::after { background: #eef3fa; }

    .hero.night .cloud {
      background: linear-gradient(180deg, #475569 0%, #334155 72%, #1e293b 100%);
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.55);
    }
    .hero.night .cloud::before { background: #64748b; }
    .hero.night .cloud::after { background: #475569; }

    .c1 { width: 112px; height: 30px; top: 76px; left: -120px; animation: driftRight 24s linear infinite; }
    .c1::before { width: 46px; height: 46px; top: -20px; left: 16px; }
    .c1::after { width: 34px; height: 34px; top: -13px; left: 50px; }

    .c2 { width: 136px; height: 34px; top: 122px; left: -150px; animation: driftRight 28s linear -9s infinite; }
    .c2::before { width: 54px; height: 54px; top: -24px; left: 22px; }
    .c2::after { width: 42px; height: 42px; top: -16px; left: 62px; }

    .c3 { width: 92px; height: 24px; top: 174px; left: -110px; opacity: 0.88; animation: driftRight 17s linear -5s infinite; }
    .c3::before { width: 38px; height: 38px; top: -16px; left: 14px; }
    .c3::after { width: 28px; height: 28px; top: -10px; left: 42px; }

    .hero.clear .cloud.front { opacity: 0; transition: opacity 0.4s ease; }
    .hero.cloudy .cloud.front { opacity: 0.96; transition: opacity 0.4s ease; }

    @keyframes driftRight {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(620px, 0, 0); }
    }

    /* Rain & Thunder */
    .rain-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        105deg,
        rgba(226, 232, 240, 0.45) 0px,
        rgba(226, 232, 240, 0.45) 1.5px,
        transparent 1.5px,
        transparent 18px
      );
      animation: rainFall 0.45s linear infinite;
    }

    .hero.rainy .rain-layer { opacity: 0.72; }

    @keyframes rainFall {
      0% { background-position: 0 0; }
      100% { background-position: -36px 90px; }
    }

    /* === SPECIAL 5-MINUTE NIGHT LIGHTHOUSE & STORM 2D ANIMATIC SCENE === */
    .lighthouse-scene {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .lighthouse-scene.active {
      opacity: 1;
      visibility: visible;
    }

    .lighthouse-scene svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Meteorite diagonal streak */
    .meteor-group {
      opacity: 0;
      transform-origin: center;
    }
    .lighthouse-scene.active .meteor-group {
      animation: meteorShoot 4.2s cubic-bezier(0.22, 1, 0.36, 1) 0.8s infinite;
    }
    @keyframes meteorShoot {
      0% { opacity: 0; transform: translate3d(-40px, -25px, 0) scale(0.7); }
      12% { opacity: 1; }
      45% { opacity: 1; transform: translate3d(150px, 75px, 0) scale(1); }
      55%, 100% { opacity: 0; transform: translate3d(185px, 95px, 0) scale(0.6); }
    }

    /* Lighthouse focus beam sweeping onto boat */
    .lh-beam {
      transform-origin: 126px 196px;
      animation: beamSweep 5s ease-in-out infinite;
    }
    @keyframes beamSweep {
      0%, 100% { transform: rotate(-4deg); opacity: 0.78; }
      50% { transform: rotate(5deg); opacity: 0.95; }
    }

    /* Lighthouse lantern glow */
    .lh-lantern {
      animation: lanternPulse 1.8s ease-in-out infinite;
    }
    @keyframes lanternPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    /* Approaching Wind Storm Vortex */
    .wind-vortex {
      transform-origin: 205px 265px;
      animation: vortexApproach 7s ease-in-out infinite;
    }
    @keyframes vortexApproach {
      0%, 100% { transform: translate3d(18px, 0, 0) scale(0.92); opacity: 0.75; }
      50% { transform: translate3d(-12px, -3px, 0) scale(1.06); opacity: 0.98; }
    }

    /* Boat rocking on dangerous sea waves */
    .sea-boat {
      transform-origin: 315px 282px;
      animation: boatRock 2.4s ease-in-out infinite;
    }
    @keyframes boatRock {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-4deg); }
      50% { transform: translate3d(3px, -5px, 0) rotate(5deg); }
    }

    /* Dangerous waves surging */
    .wave-back {
      animation: waveMove1 3.2s ease-in-out infinite;
    }
    .wave-front {
      animation: waveMove2 2.4s ease-in-out infinite;
    }
    @keyframes waveMove1 {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(-12px, -3px, 0); }
    }
    @keyframes waveMove2 {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(14px, -4px, 0); }
    }

    /* Sharp Thunderstorm Lightning Bolt */
    .scene-bolt {
      opacity: 0;
    }
    .lighthouse-scene.active .scene-bolt {
      animation: boltStrike 4.8s infinite;
    }
    .scene-flash {
      opacity: 0;
    }
    .lighthouse-scene.active .scene-flash {
      animation: skyFlash 4.8s infinite;
    }
    @keyframes boltStrike {
      0%, 68%, 100% { opacity: 0; }
      70% { opacity: 1; }
      72% { opacity: 0.15; }
      74% { opacity: 1; }
      78% { opacity: 0; }
    }
    @keyframes skyFlash {
      0%, 68%, 100% { opacity: 0; }
      70% { opacity: 0.25; }
      74% { opacity: 0.32; }
      78% { opacity: 0; }
    }

    /* Foreground Hero Content */
    .hero-content {
      position: relative;
      z-index: 5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      gap: 0.4rem;
    }

    .scene-pill {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(244, 155, 82, 0.55);
      color: #fde68a;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .scene-pill:active { transform: scale(0.95); }

    .search-box {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(15, 18, 25, 0.48);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input::placeholder { color: rgba(255, 255, 255, 0.72); }

    .search-box button {
      padding: 0.6rem 0.95rem;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #141413;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .date-line {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .temp-row {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
    }

    .temp-big {
      font-size: 3.3rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .temp-unit {
      font-size: 1.3rem;
      color: var(--text-muted);
    }

    .city-title {
      font-size: 1.38rem;
      font-weight: 700;
      margin-top: 0.2rem;
      margin-bottom: 0.65rem;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 0.36rem;
      font-size: 0.88rem;
      color: #fff;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .err-box {
      display: none;
      background: rgba(127, 29, 29, 0.94);
      border: 1px solid #fca5a5;
      color: #fef2f2;
      padding: 0.75rem 0.95rem;
      border-radius: 16px;
      font-size: 0.85rem;
    }

    .err-box.show { display: block; }

    .section-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: #f8fafc;
      padding: 0.1rem 0.2rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .metric-card {
      background: var(--card-dark);
      border-radius: 22px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .metric-card:hover {
      transform: translate3d(0, -3px, 0);
      border-color: rgba(244, 155, 82, 0.45);
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .metric-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent);
      color: #141413;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .metric-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-top: 0.5rem;
    }

    .metric-sub {
      font-size: 0.75rem;
      color: rgba(248, 250, 252, 0.65);
      margin-top: 0.15rem;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0.85rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 1.8rem);
      max-width: 440px;
      background: var(--card-dark);
      border-radius: 26px;
      padding: 0.45rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: rgba(248, 250, 252, 0.75);
      padding: 0.55rem 0.4rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>
<body class="theme-day">
  <div class="app">
    <section class="hero clear" id="heroBox">
      <div class="sky-layer">
        <div class="stars"></div>
        <div class="celestial sun" id="celestialBody"></div>
        <div class="cloud back c1"></div>
        <div class="cloud front c2"></div>
        <div class="cloud front c3"></div>
        <div class="rain-layer"></div>

        <!-- Custom 2D Anime Night Lighthouse + Storm + Meteorite Scene (Triggers every 5 mins at night) -->
        <div class="lighthouse-scene" id="lighthouseScene">
          <svg viewBox="0 0 420 330" preserveAspectRatio="xMidYMax slice">
            <defs>
              <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="50%">
                <stop offset="0%" stop-color="#fef08a" stop-opacity="0.72" />
                <stop offset="55%" stop-color="#fde047" stop-opacity="0.28" />
                <stop offset="100%" stop-color="#fef08a" stop-opacity="0.0" />
              </linearGradient>
              <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
                <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
              </linearGradient>
              <linearGradient id="seaGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#0f294a" />
                <stop offset="100%" stop-color="#061224" />
              </linearGradient>
              <linearGradient id="seaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#163b66" />
                <stop offset="100%" stop-color="#08172e" />
              </linearGradient>
            </defs>

            <!-- Lightning sky flash overlay -->
            <rect class="scene-flash" x="0" y="0" width="420" height="330" fill="#e0f2fe" />

            <!-- Extra crisp anime stars -->
            <g fill="#ffffff" opacity="0.9">
              <circle cx="52" cy="48" r="1.6" />
              <circle cx="88" cy="34" r="1.1" />
              <circle cx="155" cy="42" r="1.8" />
              <circle cx="215" cy="28" r="1.3" />
              <circle cx="265" cy="52" r="1.5" />
              <path d="M182 54 L184 59 L189 61 L184 63 L182 68 L180 63 L175 61 L180 59 Z" fill="#fef9c3" />
            </g>

            <!-- Diagonal Shooting Meteorite -->
            <g class="meteor-group">
              <line x1="40" y1="62" x2="108" y2="96" stroke="url(#meteorGrad)" stroke-width="3.2" stroke-linecap="round" />
              <circle cx="109" cy="96.5" r="3.5" fill="#ffffff" />
              <circle cx="109" cy="96.5" r="7" fill="#7dd3fc" opacity="0.45" />
            </g>

            <!-- Thunderstorm Sharp Lightning Bolt (Right side) -->
            <g class="scene-bolt">
              <polyline
                points="365,86 342,132 368,136 334,195 352,198 322,248"
                fill="none"
                stroke="#e0f2fe"
                stroke-width="3.2"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
              <polyline
                points="365,86 342,132 368,136 334,195 352,198 322,248"
                fill="none"
                stroke="#38bdf8"
                stroke-width="7"
                opacity="0.38"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </g>

            <!-- Lighthouse Searchlight Beam focusing onto Boat -->
            <polygon class="lh-beam" points="126,192 355,274 328,302 126,201" fill="url(#beamGrad)" />

            <!-- Approaching Wind Storm Tornado Vortex -->
            <g class="wind-vortex" fill="none" stroke="#94a3b8" stroke-linecap="round">
              <ellipse cx="205" cy="212" rx="22" ry="5" stroke-width="2.2" opacity="0.65" />
              <ellipse cx="202" cy="224" rx="18" ry="4.5" stroke-width="2.2" opacity="0.72" />
              <ellipse cx="207" cy="236" rx="14" ry="4" stroke-width="2.2" opacity="0.78" />
              <ellipse cx="203" cy="248" rx="11" ry="3.5" stroke-width="2.2" opacity="0.82" />
              <ellipse cx="206" cy="260" rx="8" ry="3" stroke-width="2" opacity="0.86" />
              <ellipse cx="204" cy="272" rx="5" ry="2.2" stroke-width="2" opacity="0.9" />
            </g>

            <!-- Classic 2D Anime Lighthouse on Rocks -->
            <g>
              <!-- Tower body (red & white stripes) -->
              <polygon points="106,276 113,205 137,205 144,276" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
              <polygon points="109,248 111,228 139,228 141,248" fill="#ef4444" />
              <!-- Gallery deck -->
              <rect x="104" y="200" width="42" height="6" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
              <!-- Lantern glass room -->
              <rect class="lh-lantern" x="113" y="185" width="24" height="15" r

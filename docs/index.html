<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather ZenithX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #070d1f, #111f44);
      color: #f8fafc;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }
    .app { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 1rem; }
    .card {
      background: #121c38;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 1.2rem;
    }
    .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    input {
      flex: 1;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: #0b1226;
      color: #fff;
      font-size: 0.95rem;
    }
    button {
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #060b19;
      font-weight: 700;
      cursor: pointer;
    }
    .temp { font-size: 3.4rem; font-weight: 800; margin: 0.6rem 0; }
    .muted { color: #94a3b8; font-size: 0.9rem; }
    .err {
      display: none;
      background: rgba(248,113,113,0.18);
      border: 1px solid #f87171;
      color: #fecaca;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-size: 0.88rem;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <h2>Weather ZenithX</h2>
      <div class="row">
        <input id="cityInput" type="text" placeholder="Enter city (e.g. Kolkata, Delhi)" />
        <button id="searchBtn" type="button">Search</button>
      </div>
    </div>

    <div class="err" id="errBox"></div>

    <div class="card">
      <div id="place" style="font-size:1.35rem;font-weight:700;">Kolkata</div>
      <div class="muted" id="status">Starting...</div>
      <div class="temp" id="temp">--°C</div>
      <div class="muted" id="details">Wind: -- | Humidity: --</div>
    </div>
  </div>

  <script>
    window.addEventListener("error", function (e) {
      const box = document.getElementById("errBox");
      box.textContent = "JS Error: " + e.message;
      box.classList.add("show");
    });

    function showErr(msg) {
      const box = document.getElementById("errBox");
      box.textContent = msg;
      box.classList.add("show");
    }

    function clearErr() {
      const box = document.getElementById("errBox");
      box.textContent = "";
      box.classList.remove("show");
    }

    function paintWeather(city, temp, wind, humidity, cond, source) {
      document.getElementById("place").textContent = city;
      document.getElementById("temp").textContent = Math.round(temp) + "°C";
      document.getElementById("status").textContent = cond + " (" + source + ")";
      document.getElementById("details").textContent =
        "Wind: " + Math.round(wind) + " km/h | Humidity: " + humidity + "%";
    }

    async function fetchWeather(city) {
      clearErr();
      document.getElementById("status").textContent = "Fetching live data...";

      // 1. Try Open-Meteo Geocoding + Forecast
      try {
        const gUrl = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(city) + "&count=1";
        const gRes = await fetch(gUrl);
        const gJson = await gRes.json();

        if (gJson.results && gJson.results.length > 0) {
          const loc = gJson.results[0];
          const wUrl =
            "https://api.open-meteo.com/v1/forecast?latitude=" +
            loc.latitude +
            "&longitude=" +
            loc.longitude +
            "&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code";
          const wRes = await fetch(wUrl);
          const wJson = await wRes.json();

          if (wJson.current) {
            paintWeather(
              loc.name + (loc.country_code ? ", " + loc.country_code : ""),
              wJson.current.temperature_2m,
              wJson.current.wind_speed_10m,
              wJson.current.relative_humidity_2m,
              "Code " + wJson.current.weather_code,
              "Open-Meteo"
            );
            return;
          }
        }
      } catch (e1) {
        // Fallback below
      }

      // 2. Fallback to wttr.in
      try {
        const tRes = await fetch("https://wttr.in/" + encodeURIComponent(city) + "?format=j1");
        const tJson = await tRes.json();
        if (tJson.current_condition && tJson.current_condition[0]) {
          const cur = tJson.current_condition[0];
          paintWeather(
            city,
            cur.temp_C,
            cur.windspeedKmph,
            cur.humidity,
            cur.weatherDesc && cur.weatherDesc[0] ? cur.weatherDesc[0].value : "Live",
            "wttr.in"
          );
          return;
        }
      } catch (e2) {
        showErr("Dono weather servers se data nahi aa paya. Network/DNS check karein.");
      }

      document.getElementById("status").textContent = "Could not load weather";
    }

    document.getElementById("searchBtn").addEventListener("click", function () {
      const val = document.getElementById("cityInput").value.trim();
      if (val) fetchWeather(val);
    });

    fetchWeather("Kolkata");
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather ZenithX</title>
  <style>
    :root {
      --bg-outer: #16181d;
      --card-dark: #141413;
      --text-main: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.82);
      --accent: #f49b52;
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-outer);
      color: var(--text-main);
      padding: 0.9rem 0.9rem 5.5rem 0.9rem;
      display: flex;
      justify-content: center;
      transition: background 0.5s ease;
    }

    body.theme-day {
      background: linear-gradient(180deg, #279be8 0%, #58b8f5 52%, #6f776c 100%);
    }

    body.theme-night {
      background: linear-gradient(180deg, #070b17 0%, #101933 55%, #191d26 100%);
    }

    .app {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .hero {
      position: relative;
      border-radius: 26px;
      overflow: hidden;
      padding: 1.15rem;
      min-height: 335px;
      border: 1px solid var(--border);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.4);
      background: linear-gradient(180deg, #1693e6 0%, #5cc0ff 72%, #8cd4ff 100%);
      transition: background 0.6s ease;
    }

    .hero.night {
      background: linear-gradient(180deg, #040711 0%, #0b152e 65%, #15223f 100%);
    }

    .sky-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity, transform;
      transition: opacity 0.5s ease;
      background-image:
        radial-gradient(1.5px 1.5px at 14% 18%, #ffffff, transparent),
        radial-gradient(1px 1px at 28% 36%, #e2e8f0, transparent),
        radial-gradient(2px 2px at 46% 14%, #ffffff, transparent),
        radial-gradient(1.2px 1.2px at 66% 24%, #cbd5e1, transparent),
        radial-gradient(1.8px 1.8px at 82% 16%, #ffffff, transparent),
        radial-gradient(1px 1px at 90% 38%, #f8fafc, transparent),
        radial-gradient(1.5px 1.5px at 36% 52%, #e2e8f0, transparent);
    }

    .hero.night .stars {
      opacity: 0.9;
      animation: starTwinkle 3.6s ease-in-out infinite;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.65; transform: translate3d(0, 0, 0); }
      50% { opacity: 1; transform: translate3d(0, -1px, 0); }
    }

    .celestial {
      position: absolute;
      top: 56px;
      right: 24px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      z-index: 1;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      transition: all 0.5s ease;
    }

    .celestial.sun {
      background: radial-gradient(circle at 35% 35%, #fff59d 0%, #ffca28 55%, #ff8f00 100%);
      box-shadow: 0 0 28px rgba(255, 202, 40, 0.88), 0 0 64px rgba(255, 143, 0, 0.48);
      animation: sunPulse 4.5s ease-in-out infinite;
    }

    .celestial.sun::after {
      content: "";
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 236, 153, 0.55);
      animation: sunOrbit 14s linear infinite;
    }

    .celestial.moon {
      background: radial-gradient(circle at 32% 30%, #ffffff 0%, #e2e8f0 68%, #94a3b8 100%);
      box-shadow: 0 0 26px rgba(226, 232, 240, 0.72), 0 0 54px rgba(148, 163, 184, 0.35);
      animation: moonFloat 5s ease-in-out infinite;
    }

    .celestial.moon::after { content: none; }

    .hero.cloudy .celestial { opacity: 0.72; filter: blur(0.5px); }
    .hero.clear .celestial { opacity: 1; filter: none; }

    @keyframes sunPulse {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(0, -3px, 0) scale(1.05); }
    }

    @keyframes sunOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes moonFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -4px, 0); }
    }

    /* 2D Shaded Clouds */
    .cloud {
      position: absolute;
      border-radius: 999px;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .cloud.front { z-index: 3; }
    .cloud.back { z-index: 0; }

    .hero:not(.night) .cloud {
      background: linear-gradient(180deg, #ffffff 0%, #e8eef7 68%, #c7d4e6 100%);
      box-shadow: 0 4px 0 rgba(148, 163, 184, 0.35);
    }
    .hero:not(.night) .cloud::before { background: #ffffff; }
    .hero:not(.night) .cloud::after { background: #eef3fa; }

    .hero.night .cloud {
      background: linear-gradient(180deg, #475569 0%, #334155 72%, #1e293b 100%);
      box-shadow: 0 4px 0 rgba(15, 23, 42, 0.55);
    }
    .hero.night .cloud::before { background: #64748b; }
    .hero.night .cloud::after { background: #475569; }

    .c1 { width: 112px; height: 30px; top: 76px; left: -120px; animation: driftRight 24s linear infinite; }
    .c1::before { width: 46px; height: 46px; top: -20px; left: 16px; }
    .c1::after { width: 34px; height: 34px; top: -13px; left: 50px; }

    .c2 { width: 136px; height: 34px; top: 122px; left: -150px; animation: driftRight 28s linear -9s infinite; }
    .c2::before { width: 54px; height: 54px; top: -24px; left: 22px; }
    .c2::after { width: 42px; height: 42px; top: -16px; left: 62px; }

    .c3 { width: 92px; height: 24px; top: 174px; left: -110px; opacity: 0.88; animation: driftRight 17s linear -5s infinite; }
    .c3::before { width: 38px; height: 38px; top: -16px; left: 14px; }
    .c3::after { width: 28px; height: 28px; top: -10px; left: 42px; }

    .hero.clear .cloud.front { opacity: 0; transition: opacity 0.4s ease; }
    .hero.cloudy .cloud.front { opacity: 0.96; transition: opacity 0.4s ease; }

    @keyframes driftRight {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(620px, 0, 0); }
    }

    /* Rain */
    .rain-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background-image: repeating-linear-gradient(
        105deg,
        rgba(226, 232, 240, 0.45) 0px,
        rgba(226, 232, 240, 0.45) 1.5px,
        transparent 1.5px,
        transparent 18px
      );
      animation: rainFall 0.45s linear infinite;
    }

    .hero.rainy .rain-layer { opacity: 0.72; }

    @keyframes rainFall {
      0% { background-position: 0 0; }
      100% { background-position: -36px 90px; }
    }

    /* === SPECIAL 5-MINUTE DAYTIME HOWRAH BRIDGE & DURGA PUJA VIBE 2D SCENE === */
    .daytime-scene {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .daytime-scene.active {
      opacity: 1;
      visibility: visible;
    }

    .daytime-scene svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .v-flock-main, .v-flock-second, .boat-1, .boat-2, .boat-3, .boat-4 {
      will-change: transform;
    }

    .daytime-scene.active .v-flock-main {
      animation: vFlockFly1 11s ease-in-out infinite;
    }
    @keyframes vFlockFly1 {
      0% { transform: translate3d(-120px, 12px, 0); }
      50% { transform: translate3d(20px, -6px, 0); }
      100% { transform: translate3d(160px, 8px, 0); }
    }

    .daytime-scene.active .v-flock-second {
      animation: vFlockFly2 13s ease-in-out -4s infinite;
    }
    @keyframes vFlockFly2 {
      0% { transform: translate3d(-90px, -4px, 0); }
      50% { transform: translate3d(35px, 8px, 0); }
      100% { transform: translate3d(170px, -2px, 0); }
    }

    .bird-wing {
      transform-box: fill-box;
      transform-origin: center;
    }
    .daytime-scene.active .bird-wing {
      animation: flapWing 0.52s ease-in-out infinite alternate;
    }
    @keyframes flapWing {
      0% { transform: scaleY(1); }
      100% { transform: scaleY(0.28); }
    }

    .daytime-scene.active .boat-1 { animation: steamerMove1 9s ease-in-out infinite; }
    @keyframes steamerMove1 {
      0%, 100% { transform: translate3d(-16px, 0, 0); }
      50% { transform: translate3d(22px, -1.5px, 0); }
    }

    .daytime-scene.active .boat-2 { animation: steamerMove2 11s ease-in-out -3s infinite; }
    @keyframes steamerMove2 {
      0%, 100% { transform: translate3d(18px, 0, 0); }
      50% { transform: translate3d(-20px, 1.5px, 0); }
    }

    .daytime-scene.active .boat-3 { animation: steamerMove3 8.5s ease-in-out -2s infinite; }
    @keyframes steamerMove3 {
      0%, 100% { transform: translate3d(-14px, 1px, 0); }
      50% { transform: translate3d(24px, -1px, 0); }
    }

    .daytime-scene.active .boat-4 { animation: steamerMove4 10s ease-in-out -5s infinite; }
    @keyframes steamerMove4 {
      0%, 100% { transform: translate3d(16px, -1px, 0); }
      50% { transform: translate3d(-22px, 1.5px, 0); }
    }

    .breeze-swirl {
      stroke-dasharray: 65 135;
      stroke-dashoffset: 200;
    }
    .daytime-scene.active .breeze-swirl {
      animation: breezeDrift 4.5s linear infinite;
    }
    @keyframes breezeDrift {
      0% { stroke-dashoffset: 200; opacity: 0.1; }
      35% { opacity: 0.72; }
      100% { stroke-dashoffset: -120; opacity: 0.05; }
    }

    .kaash-sway {
      transform-box: fill-box;
      transform-origin: bottom center;
    }
    .daytime-scene.active .kaash-sway {
      animation: kaashWave 3.2s ease-in-out infinite;
    }
    @keyframes kaashWave {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }

    /* === SPECIAL 5-MINUTE NIGHT LIGHTHOUSE & STORM 2D ANIMATIC SCENE === */
    .lighthouse-scene {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .lighthouse-scene.active {
      opacity: 1;
      visibility: visible;
    }

    .lighthouse-scene svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .meteor-group {
      opacity: 0;
      transform-origin: center;
      will-change: transform, opacity;
    }
    .lighthouse-scene.active .meteor-group {
      animation: meteorShoot 4.2s cubic-bezier(0.22, 1, 0.36, 1) 0.8s infinite;
    }
    @keyframes meteorShoot {
      0% { opacity: 0; transform: translate3d(-40px, -25px, 0) scale(0.75); }
      12% { opacity: 1; }
      45% { opacity: 1; transform: translate3d(145px, 72px, 0) scale(1); }
      55%, 100% { opacity: 0; transform: translate3d(180px, 90px, 0) scale(0.6); }
    }

    .lh-beam {
      transform-origin: 118px 176px;
      will-change: transform, opacity;
    }
    .lighthouse-scene.active .lh-beam {
      animation: beamSweep 5s ease-in-out infinite;
    }
    @keyframes beamSweep {
      0%, 100% { transform: rotate(-3deg); opacity: 0.75; }
      50% { transform: rotate(4deg); opacity: 0.92; }
    }

    /* Broad swirling storm wind gust (not tiny bicycle wheels) */
    .wind-gust-layer {
      transform-origin: 245px 215px;
      will-change: transform, opacity;
    }
    .lighthouse-scene.active .wind-gust-layer {
      animation: windGustSwirl 5.5s ease-in-out infinite;
    }
    @keyframes windGustSwirl {
      0%, 100% { transform: translate3d(18px, 0, 0) scale(0.95); opacity: 0.65; }
      50% { transform: translate3d(-16px, -4px, 0) scale(1.05); opacity: 0.92; }
    }

    /* Proper 2D Sailboat + Boatman rocking on heavy waves */
    .sail-boat-group {
      transform-origin: 325px 276px;
      will-change: transform;
    }
    .lighthouse-scene.active .sail-boat-group {
      animation: sailBoatRock 2.6s ease-in-out infinite;
    }
    @keyframes sailBoatRock {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-3.5deg); }
      50% { transform: translate3d(4px, -5px, 0) rotate(4.5deg); }
    }

    .wave-back, .wave-front {
      will-change: transform;
    }
    .lighthouse-scene.active .wave-back {
      animation: waveSurge1 3.4s ease-in-out infinite;
    }
    .lighthouse-scene.active .wave-front {
      animation: waveSurge2 2.5s ease-in-out infinite;
    }
    @keyframes waveSurge1 {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(-12px, -4px, 0); }
    }
    @keyframes waveSurge2 {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(14px, -5px, 0); }
    }

    .scene-bolt, .scene-flash {
      opacity: 0;
    }
    .lighthouse-scene.active .scene-bolt {
      animation: boltStrike 4.8s infinite;
    }
    .lighthouse-scene.active .scene-flash {
      animation: skyFlash 4.8s infinite;
    }
    @keyframes boltStrike {
      0%, 68%, 100% { opacity: 0; }
      70% { opacity: 1; }
      72% { opacity: 0.15; }
      74% { opacity: 1; }
      78% { opacity: 0; }
    }
    @keyframes skyFlash {
      0%, 68%, 100% { opacity: 0; }
      70% { opacity: 0.24; }
      74% { opacity: 0.32; }
      78% { opacity: 0; }
    }

    /* Foreground Hero Content */
    .hero-content {
      position: relative;
      z-index: 5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.7rem;
      gap: 0.35rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .scene-pill {
      background: rgba(15, 23, 42, 0.68);
      border: 1px solid rgba(244, 155, 82, 0.6);
      color: #fde68a;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .scene-pill:active { transform: scale(0.95); }

    .search-box {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(15, 18, 25, 0.48);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input::placeholder { color: rgba(255, 255, 255, 0.72); }

    .search-box button {
      padding: 0.6rem 0.95rem;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #141413;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .date-line {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .temp-row {
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
    }

    .temp-big {
      font-size: 3.3rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .temp-unit {
      font-size: 1.3rem;
      color: var(--text-muted);
    }

    .city-title {
      font-size: 1.38rem;
      font-weight: 700;
      margin-top: 0.2rem;
      margin-bottom: 0.65rem;
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 0.36rem;
      font-size: 0.88rem;
      color: #fff;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .err-box {
      display: none;
      background: rgba(127, 29, 29, 0.94);
      border: 1px solid #fca5a5;
      color: #fef2f2;
      padding: 0.75rem 0.95rem;
      border-radius: 16px;
      font-size: 0.85rem;
    }

    .err-box.show { display: block; }

    .section-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: #f8fafc;
      padding: 0.1rem 0.2rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .metric-card {
      background: var(--card-dark);
      border-radius: 22px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .metric-card:hover {
      transform: translate3d(0, -3px, 0);
      border-color: rgba(244, 155, 82, 0.45);
    }

    .metric-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .metric-val {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
    }

    .badge-dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: var(--accent);
      color: #141413;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .metric-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #f1f5f9;
      margin-top: 0.5rem;
    }

    .metric-sub {
      font-size: 0.75rem;
      color: rgba(248, 250, 252, 0.65);
      margin-top: 0.15rem;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0.85rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 1.8rem);
      max-width: 440px;
      background: var(--card-dark);
      border-radius: 26px;
      padding: 0.45rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: rgba(248, 250, 252, 0.75);
      padding: 0.55rem 0.4rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>
<body class="theme-day">
  <div class="app">
    <section class="hero clear" id="heroBox">
      <div class="sky-layer">
        <div class="stars"></div>
        <div class="celestial sun" id="celestialBody"></div>
        <div class="cloud back c1"></div>
        <div class="cloud front c2"></div>
        <div class="cloud front c3"></div>
        <div class="rain-layer"></div>

        <!-- Daytime 2D Animatic Scene: Howrah Bridge + Durga Puja Glow + V-Birds + 4 Streamers + Breeze -->
        <div class="daytime-scene" id="daytimeScene">
          <svg viewBox="0 0 420 335" preserveAspectRatio="xMidYMax slice">
            <defs>
              <linearGradient id="pujaSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#60b8f0" />
                <stop offset="58%" stop-color="#bfe7ff" />
                <stop offset="88%" stop-color="#fff0bd" />
                <stop offset="100%" stop-color="#ffe09e" />
              </linearGradient>
              <radialGradient id="pujaSunGlow" cx="55%" cy="46%" r="55%">
                <stop offset="0%" stop-color="#fff9db" stop-opacity="0.95" />
                <stop offset="45%" stop-color="#fde68a" stop-opacity="0.45" />
                <stop offset="100%" stop-color="#fde68a" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="gangaWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#9ad4f2" />
                <stop offset="45%" stop-color="#69b5e0" />
                <stop offset="100%" stop-color="#3b8ec4" />
              </linearGradient>
            </defs>

            <rect x="0" y="0" width="420" height="238" fill="url(#pujaSkyGrad)" />
